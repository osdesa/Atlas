[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-studio"
version = "0.1.0"
description = "Local PySide6 desktop studio for Atlas task graphs and benchmarks"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23,<5",
  "PySide6>=6.8,<7"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.16,<0.17"
]

[project.scripts]
atlas-studio = "atlas_studio.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_studio*"]

[tool.setuptools.package-data]
"atlas_studio.resources" = ["*.qss"]
