name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Doxygen documentation
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:bkryza/clang-uml
          sudo apt-get update
          sudo apt-get install --yes \
            default-jre-headless \
            doxygen \
            graphviz \
            clang-uml \
            libvulkan-dev \
            ninja-build

      - name: Configure documentation
        run: >
          cmake --preset docs-linux
          -DATLAS_BUILD_TESTS=OFF
          -DATLAS_ENABLE_CLANG_TIDY=OFF
          -DATLAS_ENABLE_SANITIZERS=OFF
          -DATLAS_WARNINGS_AS_ERRORS=OFF

      - name: Build documentation
        run: cmake --build --preset docs-linux --parallel

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs-linux/docs/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
