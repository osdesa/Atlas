name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-desktop:
    name: Atlas Studio / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: studio/requirements.lock

      - name: Install desktop dependencies
        run: |
          python -m pip install --disable-pip-version-check -r studio/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e studio

      - name: Test desktop application
        working-directory: studio
        run: |
          ruff format --check atlas_studio tests
          ruff check atlas_studio tests
          python -m pytest -q

  format:
    name: ClangFormat
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ClangFormat
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.h' '*.hpp' | xargs -0 clang-format --dry-run --Werror

  linux:
    name: Ubuntu / Vulkan / GCC
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslc spirv-tools

      - name: Select Lavapipe
        run: |
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "${lavapipe_icd}"
          echo "VK_DRIVER_FILES=${lavapipe_icd}" >> "${GITHUB_ENV}"

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux --parallel

      - name: Test
        run: ctest --preset ci-linux

      - name: Run Atlas
        run: ./build/ci-linux/apps/atlas/atlas

      - name: Run Atlas Studio graph contract
        run: |
          ./build/ci-linux/apps/atlas_studio_runner/atlas_studio_runner \
            --config studio/examples/all-kernels-graph-v1.json \
            --control build/ci-linux/studio-cancel > build/ci-linux/studio-run.jsonl
          python3 -c "import json, pathlib; records=[json.loads(line) for line in pathlib.Path('build/ci-linux/studio-run.jsonl').read_text().splitlines()]; assert records[0]['record_type']=='header'; assert records[-1]['record_type']=='footer'; assert any(record.get('record_type')=='result' and record.get('status')=='Success' for record in records)"

      - name: Run benchmark smoke suite
        run: |
          ./build/ci-linux/apps/atlas_bench/atlas_bench \
            --suite benchmarks/manifests/smoke-v1.json \
            --environment-file benchmarks/environments/ci-lavapipe.json \
            --output-dir build/ci-linux/smoke-results

      - name: Run Atlas Studio benchmark progress contract
        run: |
          ./build/ci-linux/apps/atlas_bench/atlas_bench \
            --suite benchmarks/manifests/smoke-v1.json \
            --output-dir build/ci-linux/studio-benchmark-results \
            --studio-progress-jsonl > build/ci-linux/studio-benchmark-progress.jsonl
          python3 -c "import json,pathlib; records=[json.loads(line) for line in pathlib.Path('build/ci-linux/studio-benchmark-progress.jsonl').read_text().splitlines()]; assert records[0].get('benchmark_stream_version')==1; assert records[-1].get('record_type')=='footer' and records[-1].get('status')=='success'; assert any(r.get('record_type')=='run_finished' and r.get('execution')=='direct' for r in records); assert any(r.get('record_type')=='run_finished' and r.get('execution')=='scheduled' for r in records); sources={r.get('source') for r in records if r.get('record_type')=='event'}; assert {'direct_coordinator','scheduler','cpu_executor','vulkan_executor'} <= sources"

      - name: Analyze benchmark smoke suite
        run: |
          python3 -m unittest discover -s tests/tools -p 'test_*.py'
          python3 tools/atlas_evaluation.py analyze \
            --study benchmarks/evaluation/smoke-v1/study.json \
            --results build/ci-linux/smoke-results \
            --output-dir build/ci-linux/smoke-evaluation
          test -s build/ci-linux/smoke-evaluation/evaluation.json
          test -s build/ci-linux/smoke-evaluation/plots/smoke.svg

      - name: Validate trace tooling
        run: |
          ./build/ci-linux/apps/atlas/atlas --trace build/ci-linux/atlas-trace.jsonl
          python3 tools/atlas_trace.py validate build/ci-linux/atlas-trace.jsonl
          python3 tools/atlas_trace.py summary build/ci-linux/atlas-trace.jsonl
          python3 tools/atlas_trace.py timeline build/ci-linux/atlas-trace.jsonl --output build/ci-linux/atlas-trace.svg
          test -s build/ci-linux/atlas-trace.svg

      - name: Validate profiling-disabled build
        run: |
          cmake --preset profiling-disabled-linux
          cmake --build --preset profiling-disabled-linux --parallel
          ctest --preset profiling-disabled-linux

  clang-tidy:
    name: ClangTidy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build libvulkan-dev glslc spirv-tools

      - name: Configure
        run: cmake --preset analysis-linux

      - name: Build and analyze
        run: cmake --build --preset analysis-linux --parallel

  coverage:
    name: Source coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install coverage and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build lcov libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslc spirv-tools

      - name: Select Lavapipe
        run: |
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "${lavapipe_icd}"
          echo "VK_DRIVER_FILES=${lavapipe_icd}" >> "${GITHUB_ENV}"

      - name: Build and test instrumented targets
        run: |
          cmake --preset coverage-linux
          cmake --build --preset coverage-linux --parallel
          ctest --preset coverage-linux

      - name: Capture project coverage
        run: |
          lcov --capture --directory build/coverage-linux --output-file build/coverage-linux/coverage.info --ignore-errors mismatch
          lcov --remove build/coverage-linux/coverage.info '/usr/*' '*/build/_deps/*' '*/tests/*' --output-file build/coverage-linux/coverage.info
          lcov --summary build/coverage-linux/coverage.info

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: atlas-coverage
          path: build/coverage-linux/coverage.info

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:bkryza/clang-uml
          sudo apt-get update
          sudo apt-get install --yes default-jre doxygen graphviz clang-uml ninja-build libvulkan-dev glslc spirv-tools

      - name: Configure
        run: cmake --preset docs-linux

      - name: Build documentation
        run: cmake --build --preset docs-linux --parallel
