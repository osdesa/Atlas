name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: ClangFormat
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ClangFormat
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Check formatting
        run: git ls-files -z '*.cpp' '*.h' '*.hpp' | xargs -0 clang-format --dry-run --Werror

  linux:
    name: Ubuntu / Vulkan / GCC
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslc spirv-tools

      - name: Select Lavapipe
        run: |
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "${lavapipe_icd}"
          echo "VK_DRIVER_FILES=${lavapipe_icd}" >> "${GITHUB_ENV}"

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux --parallel

      - name: Test
        run: ctest --preset ci-linux

      - name: Run Atlas
        run: ./build/ci-linux/apps/atlas/atlas

      - name: Run benchmark smoke suite
        run: ./build/ci-linux/apps/atlas_bench/atlas_bench --suite benchmarks/manifests/smoke-v1.json --output-dir build/ci-linux/smoke-results

  clang-tidy:
    name: ClangTidy
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy ninja-build libvulkan-dev glslc spirv-tools

      - name: Configure
        run: cmake --preset analysis-linux

      - name: Build and analyze
        run: cmake --build --preset analysis-linux --parallel

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:bkryza/clang-uml
          sudo apt-get update
          sudo apt-get install --yes default-jre doxygen graphviz clang-uml ninja-build libvulkan-dev glslc spirv-tools

      - name: Configure
        run: cmake --preset docs-linux

      - name: Build documentation
        run: cmake --build --preset docs-linux --parallel
